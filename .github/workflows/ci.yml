# The bundle targets DSH Web on Windows and macOS, so the suite runs on both
# GitHub-hosted platforms and on the two Node lines the engines field allows.
# npm ci runs the prepare script, which builds client.js; a broken build fails
# here before any test runs, so there is no separate build step to report.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # Packs, extracts and imports the host entry: a checkout has src/, the
      # published tarball must not need it.
      - run: npm run pack:check
      # Fails when package.json moved to a version the committed index does not
      # list yet, which is the one release step that is easy to forget.
      - run: npm run market:check
